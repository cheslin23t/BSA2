name: Deploy static archive to Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - archive.css
      - favicon.svg
      - .nojekyll
      - static/0d70454a-a90f-44cc-a185-7d097cf1abe8-Tuscarora.webp
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage public archive
        run: |
          mkdir -p _site/static
          cp index.html archive.css favicon.svg .nojekyll _site/
          cp static/0d70454a-a90f-44cc-a185-7d097cf1abe8-Tuscarora.webp _site/static/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
